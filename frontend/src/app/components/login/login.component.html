<div class="login-container">
    <div class="logo-container">
        <img alt="Università di Camerino Logo" class="logo" src="assets/images/logos/unicam-complete.svg"/>
    </div>
    <div class="login-box">
        <h2><b>Login</b></h2>

        <!-- Messaggio di errore -->
        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input [(ngModel)]="username" id="username" name="username" placeholder="Insert your username"
                       required type="text"/>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input [(ngModel)]="password" id="password" name="password" placeholder="Insert your password"
                       required type="password"/>
            </div>
            <button class="login-btn" type="submit">Login</button>
        </form>

        <p class="register-link">
            New to the platform? <a routerLink="/register">Register here</a>
        </p>
    </div>
</div>
