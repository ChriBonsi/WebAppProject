<div class="login-container">
    <div class="logo-container">
        <img src="assets/images/logos/unicam-complete.svg" alt="Università di Camerino Logo" class="logo" />
    </div>
    <div class="login-box">
        <h2><b>Login</b></h2>

        <!-- Messaggio di errore -->
        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Insert your username" required />
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Insert your password" required />
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <p class="register-link">
            New to the platform? <a routerLink="/register">Register here</a>
        </p>
    </div>
</div>
