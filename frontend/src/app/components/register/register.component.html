<div class="register-container">
    <form #registerForm="ngForm" (ngSubmit)="onSubmit()">
        <div>
            <label for="username">Username:</label>
            <input [(ngModel)]="username" id="username" name="username" required type="text">
        </div>
        <div>
            <label for="password">Password:</label>
            <input [(ngModel)]="password" id="password" name="password" required type="password">
        </div>
        <button [disabled]="!registerForm.form.valid" type="submit">Register</button>
    </form>
    <div *ngIf="errorMessage">{{ errorMessage }}</div>
</div>
